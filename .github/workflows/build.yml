name: build

on:
  # Triggers automatically on every commit/push to any branch or tag
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller qrcode

      - name: Build React Frontend (Deno)
        run: |
          cd ui
          deno install
          deno task build
          cd ..

      - name: Compile Embedded ScreenShare Go Binary
        run: |
          export CGO_ENABLED=0
          go build -ldflags="-s -w -X main.mode=prod" -o ScreenShare .

      - name: Package with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "ScreenShare-host" \
            --add-binary "ScreenShare:." \
            --add-data "users:." \
            control_server.py

      - name: Build AppImage with appimagetool
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          cp -r dist/ScreenShare-host/* AppDir/usr/bin/
          cp ui/src/logo.png AppDir/ScreenShare.png
          cp ui/src/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/ScreenShare.png

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/ScreenShare-host" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/ScreenShare.desktop
          [Desktop Entry]
          Type=Application
          Name=ScreenShare Host
          Exec=ScreenShare-host
          Icon=ScreenShare
          Categories=Network;AudioVideo;Utility;
          Terminal=false
          EOF

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir ScreenShare-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShare-x86_64.AppImage
          path: ScreenShare-x86_64.AppImage

      - name: Create Release and Upload Asset (Tagged Commits)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ScreenShare-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}