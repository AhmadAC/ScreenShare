name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller qrcode

      - name: Build React Frontend (Deno)
        run: |
          cd ui
          deno install
          deno task build
          cd ..

      - name: Compile Embedded ScreenShare Go Binary
        run: |
          export CGO_ENABLED=0
          go build -ldflags="-s -w -X main.mode=prod" -o ScreenShare .

      - name: Package with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "ScreenShare-host" \
            --add-binary "ScreenShare:." \
            --add-data "users:." \
            control_server.py

      - name: Build AppImage with appimagetool
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          cp -r dist/ScreenShare-host/* AppDir/usr/bin/
          cp ui/src/logo.png AppDir/ScreenShare.png
          cp ui/src/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/ScreenShare.png

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/ScreenShare-host" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/ScreenShare.desktop
          [Desktop Entry]
          Type=Application
          Name=ScreenShare Host
          Exec=ScreenShare-host
          Icon=ScreenShare
          Categories=Network;AudioVideo;Utility;
          Terminal=false
          EOF

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir ScreenShare-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShare-x86_64.AppImage
          path: ScreenShare-x86_64.AppImage

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller qrcode

      - name: Build React Frontend (Deno)
        run: |
          cd ui
          deno install
          deno task build
          cd ..

      - name: Compile Embedded ScreenShare Go Binary
        run: |
          $env:CGO_ENABLED="0"
          go build -ldflags="-s -w -X main.mode=prod" -o ScreenShare.exe .

      - name: Package with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "ScreenShare-host" `
            --add-binary "ScreenShare.exe;." `
            --add-data "users;." `
            control_server.py

      - name: Archive Windows Release
        run: |
          Compress-Archive -Path "dist\ScreenShare-host\*" -DestinationPath "ScreenShare-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShare-windows-x64.zip
          path: ScreenShare-windows-x64.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build React Frontend (Deno)
        run: |
          cd ui
          deno install
          deno task build
          cd ..

      - name: Cross-Compile Go Server for Android Architectures
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          mkdir -p android/app/src/main/assets

          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w -checklinkname=0 -X main.mode=prod" -o android/app/src/main/jniLibs/arm64-v8a/libscreenshare_server.so .
          CGO_ENABLED=0 GOOS=android GOARCH=arm go build -ldflags="-s -w -checklinkname=0 -X main.mode=prod" -o android/app/src/main/jniLibs/armeabi-v7a/libscreenshare_server.so .
          CGO_ENABLED=0 GOOS=android GOARCH=amd64 go build -ldflags="-s -w -checklinkname=0 -X main.mode=prod" -o android/app/src/main/jniLibs/x86_64/libscreenshare_server.so .

          cp android/app/src/main/jniLibs/arm64-v8a/libscreenshare_server.so android/app/src/main/assets/ScreenShare-server

      - name: Build Android APK with Gradle
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../ScreenShare-android.apk
          cd ..

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShare-android.apk
          path: ScreenShare-android.apk

  release:
    name: Create Release and Upload Assets
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: ScreenShare-x86_64.AppImage
          path: ./

      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: ScreenShare-windows-x64.zip
          path: ./

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ScreenShare-android.apk
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScreenShare-x86_64.AppImage
            ScreenShare-windows-x64.zip
            ScreenShare-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}