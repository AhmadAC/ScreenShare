name: build
on: [push, pull_request]

jobs:
  screego:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.x

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Python Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build React UI with Deno
        run: |
          cd ui
          deno install
          deno task build
          cd ..

      - name: Build Go Embedded Binary
        run: |
          export CGO_ENABLED=0
          go build -ldflags="-s -w -X main.mode=prod" -o screego .

      - name: Package Application with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "screego-host" \
            --add-binary "screego:." \
            --add-data "users:." \
            control_server.py

      - name: Generate AppImage Bundle
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          cp -r dist/screego-host/* AppDir/usr/bin/
          cp ui/src/logo.png AppDir/screego.png
          cp ui/src/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/screego.png

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/screego-host" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/screego.desktop
          [Desktop Entry]
          Type=Application
          Name=Screego Host
          Exec=screego-host
          Icon=screego
          Categories=Network;AudioVideo;Utility;
          Terminal=false
          EOF

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Screego-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screego-x86_64.AppImage
          path: Screego-x86_64.AppImage

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Screego-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}